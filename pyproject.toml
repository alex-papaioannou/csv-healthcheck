[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "csv-healthcheck"
dynamic = ["version"]
description = "Dependency-free CSV validation for data pipelines"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
csv-healthcheck = "csv_healthcheck:main"

[tool.setuptools]
py-modules = ["csv_healthcheck"]

[tool.setuptools.dynamic]
version = {attr = "csv_healthcheck.__version__"}
